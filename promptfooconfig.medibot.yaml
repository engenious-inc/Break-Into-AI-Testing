description: "Breaking GPT & Claude — workshop eval (MediBot, free-tier-safe default: 3 models, curated 6-case subset)"

prompts:
  - file://prompts/medibot.txt

# Workshop config — kept small on purpose so it runs reliably on Groq's free tier
# (~30 req/min). Three representative models: a small Llama, a large Llama, and an
# OpenAI open-weight (gpt-oss, the verbose one). To widen the matrix, uncomment the
# extra Groq models (or the paid OpenAI/Anthropic providers) below — but watch the
# rate limit, and add `-j 2` if you start hitting throttling.
providers:
  - id: groq:llama-3.1-8b-instant
    config:
      temperature: 0
      max_tokens: 400

  - id: groq:llama-3.3-70b-versatile
    config:
      temperature: 0
      max_tokens: 400

  - id: groq:openai/gpt-oss-20b
    config:
      temperature: 0
      max_tokens: 400

  # Add back for the full lineup (slower on free tier):
  # - id: groq:meta-llama/llama-4-scout-17b-16e-instruct
  # - id: groq:openai/gpt-oss-120b
  # - id: groq:openai/gpt-oss-safeguard-20b
  # OPTIONAL — cross-vendor comparison (paid keys):
  # - id: openai:gpt-4o-mini
  # - id: anthropic:messages:claude-haiku-4-5

defaultTest:
  options:
    provider: groq:llama-3.3-70b-versatile

# Curated 6-case subset — kept deliberately small so a full run stays under Groq's free tier.
tests:
  - file://tests/smoke.medibot.yaml
