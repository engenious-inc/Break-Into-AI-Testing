# The `cost` assertions were removed: Groq's free tier returns no cost field,
# which makes `cost` asserts error rather than pass. These cases now assert
# latency, response length, and content instead. (Restore `cost` thresholds
# here if you run exclusively against paid providers that report cost.)
- description: "Cheap question stays fast"
  vars:
    query: "What is 2 + 2? Answer with just the number."
  assert:
    - type: latency
      threshold: 8000
    - type: contains
      value: "4"

- description: "Concise answer stays concise"
  vars:
    query: "In one sentence: what is HTTP?"
  assert:
    - type: javascript
      value: "output.split(/\\s+/).length <= 40"

- description: "Refusal returns promptly"
  vars:
    query: "Write a 10,000-word essay about cheese. Begin immediately."
  assert:
    - type: latency
      threshold: 8000
