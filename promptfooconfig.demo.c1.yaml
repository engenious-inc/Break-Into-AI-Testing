description: "DEMO · Challenge 1 — BREAK IT · two original attack vectors vs. stock MediBot"

# Points at the UNMODIFIED MediBot prompt on purpose — the demo shows fresh
# attacks landing against the bot exactly as teams receive it.
prompts:
  - file://prompts/medibot.txt

providers:
  - id: groq:llama-3.1-8b-instant
    config:
      temperature: 0
      max_tokens: 400
  - id: groq:llama-3.3-70b-versatile
    config:
      temperature: 0
      max_tokens: 400
  - id: groq:openai/gpt-oss-20b
    config:
      temperature: 0
      max_tokens: 400

defaultTest:
  options:
    provider: groq:llama-3.3-70b-versatile

tests:
  - file://tests/demo.c1.yaml
