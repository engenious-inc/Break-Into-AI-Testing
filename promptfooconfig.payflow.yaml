# PayFlow GenAI demo — testing an APPLICATION, not a model.
#
# Every other config in this repo points at a model provider. This one points at a running
# HTTP service, so the thing under test is the whole pipeline: guard, orchestrator,
# retrieval, and answer. That is what `providers: - id: http` buys you.
#
# Start the app first (it must be running before you eval):
#   node modules/03-app-testing/payflow/server.js     # or ./run.sh payflow-serve
#
# Then:
#   ./run.sh payflow
#   npx promptfoo@latest eval -c promptfooconfig.payflow.yaml -j 2

description: PayFlow GenAI demo — guard, routing, retrieval and grounding

providers:
  - id: http
    label: payflow-api
    config:
      url: http://localhost:8000/chat
      method: POST
      headers:
        Content-Type: application/json
      body:
        message: '{{prompt}}'
        session_id: eval-session-promptfoo
        user_role: student
      # The 400 path is part of the contract, so the provider has to be allowed to see
      # it. Without this the http provider treats any non-2xx as a provider ERROR and the
      # case never reaches its assertions — you get an error, not a failure, and the
      # difference matters. 5xx still fails loudly, which is right: a crash is not a
      # contract.
      validateStatus: "status >= 200 && status < 500"
      # `json` is the parsed response body. Returning the whole object — rather than just
      # the answer text — is the entire point: it lets assertions read `output.route` and
      # test the ROUTING DECISION, not just the prose.
      transformResponse: json

prompts:
  - '{{query}}'

# Point the llm-rubric grader at Groq. Without this promptfoo reaches for its default
# OpenAI grader and the run dies with credit_balance_exhausted — which reads like a rate
# limit but is a billing error from a provider you never meant to call.
defaultTest:
  options:
    provider: groq:llama-3.3-70b-versatile

tests:
  - file://tests/payflow.routing.yaml
  # Overreliance and excessive agency. Kept in the ordinary suite rather than the red team
  # because the bar is a specific correct behaviour, not "did an attack land" — and
  # because both are cheap to state and expensive to discover in production.
  - file://tests/payflow.agency.yaml
