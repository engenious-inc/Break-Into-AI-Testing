name: CI

# Free PR / main gate — no GROQ_API_KEY.
# Static hygiene + deterministic MCP suites. mcp-abuse is inverted: exit 100
# (findings) is the healthy result and maps to a green check.
#
# Node 22: promptfoo@latest currently requires >=22.22.0 (course local floor
# remains Node ≥ 20 in CLAUDE.md; CI tracks what @latest enforces).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck + bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Static-check shell scripts
        run: |
          set -euo pipefail
          # Portable (no bash-4 mapfile): while-read over process substitution
          # keeps the loop in the main shell so `set -e` aborts on any failure.
          scripts="$(git ls-files '*.sh')"
          if [ -z "$scripts" ]; then
            echo "No shell scripts found."
            exit 0
          fi
          shellcheck --version | awk '/version:/{print "shellcheck " $2}'
          echo "Checking shell scripts:"
          echo "$scripts" | sed 's/^/  /'
          # Gate on warning+: info/style findings (e.g. SC2317 unreachable-in-a-
          # trap-handler, SC1091 can't-follow-runtime-.env) are advisory false
          # positives here, and pinning to them would break CI whenever the
          # runner's shellcheck version drifts. Real defects are warning or error.
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "== $f =="
            bash -n "$f"
            shellcheck --severity=warning "$f"
          done < <(printf '%s\n' "$scripts")
          echo "All shell scripts pass bash -n + shellcheck (warning+)."

  day-index:
    name: day index coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Every promptfooconfig claimed by exactly one day page
        run: ./scripts/check-day-index.sh

  mcp:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mcp-local (ordinary)
            config: modules/03-app-testing/mcp-local/promptfooconfig.yaml
            inverted: 'false'
          - name: mcp-abuse (inverted)
            config: promptfooconfig.mcp-abuse.yaml
            inverted: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: modules/03-app-testing/mcp-local/package-lock.json
      - name: Install workshop-local MCP deps
        run: npm install --prefix modules/03-app-testing/mcp-local
      - name: Run Promptfoo MCP suite
        env:
          INVERTED: ${{ matrix.inverted }}
          CONFIG: ${{ matrix.config }}
        run: |
          set +e
          npx --yes promptfoo@latest eval -c "$CONFIG" -j 1
          code=$?
          set -e
          if [ "$INVERTED" = 'true' ]; then
            if [ "$code" -eq 100 ]; then
              echo "findings as expected (exit 100) — inverted suite healthy"
              exit 0
            fi
            if [ "$code" -eq 0 ]; then
              echo "unexpected all-pass — suite may be broken (controls without findings)"
              exit 1
            fi
            echo "promptfoo exited $code (error, not inverted findings)"
            exit "$code"
          fi
          exit "$code"
