name: Promptfoo eval & red team

# Instructor classroom demo — live Promptfoo eval + inverted red team in Actions.
# Not on every PR (Groq free-tier). Actions → this workflow → Run workflow.
#
# Needs GROQ_API_KEY under Settings → Secrets and variables → Actions.
# Missing key fails the gate (this workflow is dispatch-only, so forks stay quiet).
#
# Four jobs after the gate, always:
#   ordinary Module 0 eval + inverted MediBot
#   ordinary PayFlow routing sample + replay redteam.yaml
#
# Node 22: promptfoo@latest requires >=22.22.0.
on:
  workflow_dispatch:

concurrency:
  group: promptfoo-demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  gate:
    name: Check GROQ_API_KEY
    runs-on: ubuntu-latest
    steps:
      - name: Require secret
        run: |
          set -euo pipefail
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::error::GROQ_API_KEY is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "GROQ_API_KEY is set"

  eval-ordinary:
    name: Eval — Module 0 contains (ordinary)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Ordinary eval — pass means the bot behaved
        run: |
          set -euo pipefail
          echo "Semantics: ORDINARY — failing assertion = defect"
          npx --yes promptfoo@latest eval \
            -c modules/00-promptfoo-basics/03-assertions/contains/promptfooconfig.yaml \
            -j 1 \
            --delay 1000 \
            -o /tmp/eval-ordinary.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eval-ordinary-results
          path: /tmp/eval-ordinary.json
          if-no-files-found: ignore

  redteam-model:
    name: Red team — MediBot inverted (model)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Inverted red team — 0 or 100 both green; other codes fail
        run: |
          set +e
          echo "Semantics: INVERTED — failing assertion = finding (attack landed)"
          npx --yes promptfoo@latest eval \
            -c promptfooconfig.ci-medibot.yaml \
            -j 1 \
            --delay 1000 \
            -o /tmp/redteam-medibot.json
          code=$?
          set -e
          if [ "$code" -eq 100 ]; then
            echo "findings as expected (exit 100) — inverted suite healthy"
            exit 0
          fi
          if [ "$code" -eq 0 ]; then
            echo "this model held all 8 (exit 0) — valid inverted outcome, not a broken suite"
            echo "Qwen 3.6 27B often refuses the curated attacks; the student 3-model matrix is where some cases fail"
            exit 0
          fi
          echo "promptfoo exited $code (error, not inverted findings)"
          exit "$code"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: redteam-medibot-results
          path: /tmp/redteam-medibot.json
          if-no-files-found: ignore

  payflow-eval:
    name: Eval — PayFlow app (ordinary sample)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Start PayFlow
        run: |
          set -euo pipefail
          node modules/03-app-testing/payflow/server.js > /tmp/payflow.log 2>&1 &
          echo $! > /tmp/payflow.pid
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              echo "PayFlow healthy"
              curl -s http://127.0.0.1:8000/health
              exit 0
            fi
            sleep 1
          done
          echo "PayFlow failed to become healthy"
          cat /tmp/payflow.log || true
          exit 1
      - name: Ordinary app eval (filtered sample)
        run: |
          set -euo pipefail
          echo "Semantics: ORDINARY — testing the application (route/citations), not a bare model"
          # One routing case — enough to show HTTP provider + JSON assertions in CI.
          npx --yes promptfoo@latest eval \
            -c promptfooconfig.payflow.yaml \
            --filter-pattern "Jira blocker query routes to the jira specialist" \
            -j 1 \
            --delay 1000 \
            -o /tmp/payflow-eval.json
      - name: Stop PayFlow
        if: always()
        run: |
          if [ -f /tmp/payflow.pid ]; then kill "$(cat /tmp/payflow.pid)" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: payflow-eval-results
          path: |
            /tmp/payflow-eval.json
            /tmp/payflow.log
          if-no-files-found: ignore

  payflow-redteam:
    name: Red team — PayFlow replay (inverted)
    needs: gate
    runs-on: ubuntu-latest
    # ~22 probes × ~4 Groq calls, paced — can take a while on free tier.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Start PayFlow
        run: |
          set -euo pipefail
          node modules/03-app-testing/payflow/server.js > /tmp/payflow-redteam.log 2>&1 &
          echo $! > /tmp/payflow-redteam.pid
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              echo "PayFlow healthy"
              exit 0
            fi
            sleep 1
          done
          echo "PayFlow failed to become healthy"
          cat /tmp/payflow-redteam.log || true
          exit 1
      - name: Replay committed redteam.yaml (no generation)
        run: |
          set +e
          echo "Semantics: INVERTED — failing grader = attack landed against the running app"
          echo "Replaying committed redteam.yaml (Day 8 rate-limit path) — not regenerating"
          # Same flags as days/08 … / run.sh pacing advice.
          env -u OPENAI_API_KEY npx --yes promptfoo@latest redteam eval \
            -c redteam.yaml \
            -j 1 \
            --delay 1000 \
            -o /tmp/payflow-redteam.json
          code=$?
          set -e
          if [ "$code" -eq 100 ]; then
            echo "findings as expected (exit 100) — inverted red team healthy"
            exit 0
          fi
          if [ "$code" -eq 0 ]; then
            echo "unexpected all-pass — no attacks landed; unusual for this app"
            exit 1
          fi
          echo "promptfoo exited $code (error, not inverted findings)"
          exit "$code"
      - name: Stop PayFlow
        if: always()
        run: |
          if [ -f /tmp/payflow-redteam.pid ]; then kill "$(cat /tmp/payflow-redteam.pid)" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: payflow-redteam-results
          path: |
            /tmp/payflow-redteam.json
            /tmp/payflow-redteam.log
          if-no-files-found: ignore
