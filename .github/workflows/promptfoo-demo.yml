name: Promptfoo eval & red team

# Instructor classroom demo — live Promptfoo eval + inverted red team in Actions.
# Not on every PR (Groq free-tier). Actions → this workflow → Run workflow.
#
# Needs GROQ_API_KEY under Settings → Secrets and variables → Actions.
# Missing key fails the gate (this workflow is dispatch-only, so forks stay quiet).
#
# Three jobs after the gate:
#   ordinary Module 0 eval + inverted MediBot + one PayFlow routing case.
# PayFlow redteam.yaml replay stays local (too slow for a live Actions walkthrough).
# Each eval writes Promptfoo JSON + HTML. A final job stitches them into a
# GitHub Pages site (one URL, no download). Artifacts stay as a fallback.
# Pages source must be "GitHub Actions" (Settings → Pages).
#
# Node 22: promptfoo@latest requires >=22.22.0.
on:
  workflow_dispatch:

concurrency:
  group: promptfoo-demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  gate:
    name: Check GROQ_API_KEY
    runs-on: ubuntu-latest
    steps:
      - name: Require secret
        run: |
          set -euo pipefail
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::error::GROQ_API_KEY is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "GROQ_API_KEY is set"

  eval-ordinary:
    name: Eval — Module 0 contains (ordinary)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Ordinary eval — pass means the bot behaved
        run: |
          set -euo pipefail
          echo "Semantics: ORDINARY — failing assertion = defect"
          npx --yes promptfoo@latest eval \
            -c modules/00-promptfoo-basics/03-assertions/contains/promptfooconfig.yaml \
            -j 1 \
            --delay 1000 \
            --no-share \
            -o /tmp/eval-ordinary.json /tmp/eval-ordinary.html
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Ordinary eval"
            echo
            echo "Failing assertion = **defect**."
            echo
            echo "Live report is published after all three jobs finish (job **Publish report site**). Artifacts are a fallback."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eval-ordinary-results
          path: |
            /tmp/eval-ordinary.json
            /tmp/eval-ordinary.html
          if-no-files-found: ignore

  redteam-model:
    name: Red team — MediBot inverted (model)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Inverted red team — 0 or 100 both green; other codes fail
        run: |
          set +e
          echo "Semantics: INVERTED — failing assertion = finding (attack landed)"
          npx --yes promptfoo@latest eval \
            -c promptfooconfig.ci-medibot.yaml \
            -j 1 \
            --delay 1000 \
            --no-share \
            -o /tmp/redteam-medibot.json /tmp/redteam-medibot.html
          code=$?
          set -e
          if [ "$code" -eq 100 ]; then
            echo "findings as expected (exit 100) — inverted suite healthy"
            exit 0
          fi
          if [ "$code" -eq 0 ]; then
            echo "this model held all 8 (exit 0) — valid inverted outcome, not a broken suite"
            echo "Qwen 3.6 27B often refuses the curated attacks; the student 3-model matrix is where some cases fail"
            exit 0
          fi
          echo "promptfoo exited $code (error, not inverted findings)"
          exit "$code"
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Inverted red team (MediBot)"
            echo
            echo "Failing assertion = **finding**. Exit 0 (this model held) and 100 (attacks landed) both green."
            echo
            echo "Live report is published after all three jobs finish (job **Publish report site**)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: redteam-medibot-results
          path: |
            /tmp/redteam-medibot.json
            /tmp/redteam-medibot.html
          if-no-files-found: ignore

  payflow-eval:
    name: Eval — PayFlow app (ordinary sample)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Start PayFlow
        run: |
          set -euo pipefail
          node modules/03-app-testing/payflow/server.js > /tmp/payflow.log 2>&1 &
          echo $! > /tmp/payflow.pid
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              echo "PayFlow healthy"
              curl -s http://127.0.0.1:8000/health
              exit 0
            fi
            sleep 1
          done
          echo "PayFlow failed to become healthy"
          cat /tmp/payflow.log || true
          exit 1
      - name: Ordinary app eval (filtered sample)
        run: |
          set -euo pipefail
          echo "Semantics: ORDINARY — testing the application (route/citations), not a bare model"
          # One routing case — enough to show HTTP provider + JSON assertions in CI.
          npx --yes promptfoo@latest eval \
            -c promptfooconfig.payflow.yaml \
            --filter-pattern "Jira blocker query routes to the jira specialist" \
            -j 1 \
            --delay 1000 \
            --no-share \
            -o /tmp/payflow-eval.json /tmp/payflow-eval.html
      - name: Stop PayFlow
        if: always()
        run: |
          if [ -f /tmp/payflow.pid ]; then kill "$(cat /tmp/payflow.pid)" 2>/dev/null || true; fi
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Ordinary PayFlow eval"
            echo
            echo "Testing the **application** (route / citations), not a bare model. Failing assertion = defect."
            echo
            echo "Live report is published after all three jobs finish (job **Publish report site**)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: payflow-eval-results
          path: |
            /tmp/payflow-eval.json
            /tmp/payflow-eval.html
            /tmp/payflow.log
          if-no-files-found: ignore

  report:
    name: Publish report site
    needs: [eval-ordinary, redteam-model, payflow-eval]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Stitch Promptfoo HTML into one site
        run: |
          set -euo pipefail
          mkdir -p site
          copy_html() {
            local src="$1" dest="$2"
            if [ -f "$src" ]; then
              cp "$src" "site/$dest"
              echo "ok $dest"
            else
              echo "missing $src"
            fi
          }
          copy_html artifacts/eval-ordinary-results/eval-ordinary.html ordinary.html
          copy_html artifacts/redteam-medibot-results/redteam-medibot.html medibot.html
          copy_html artifacts/payflow-eval-results/payflow-eval.html payflow.html

          link_or_missing() {
            local file="$1" label="$2"
            if [ -f "site/$file" ]; then
              printf '<div class="card"><a href="%s">%s</a></div>\n' "$file" "$label"
            else
              printf '<div class="card muted">%s — not produced on this run</div>\n' "$label"
            fi
          }

          {
            cat <<'HDR'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promptfoo CI reports</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.45; color: #1f2328; }
    h1 { font-size: 1.4rem; }
    a { color: #0969da; }
    .muted { color: #57606a; font-size: 0.95rem; }
    .card { border: 1px solid #d0d7de; border-radius: 8px; padding: 0.9rem 1.1rem; margin: 0.7rem 0; }
  </style>
</head>
<body>
  <h1>Promptfoo eval &amp; red team</h1>
  <p class="muted">Latest classroom demo from GitHub Actions. These are Promptfoo HTML reports — the same UI as <code>npx promptfoo view</code>, which only sees evals that ran on your laptop. Not Allure.</p>
HDR
            link_or_missing ordinary.html "Ordinary eval — Module 0 contains (fail = defect)"
            link_or_missing medibot.html "Inverted red team — MediBot (fail = finding)"
            link_or_missing payflow.html "Ordinary eval — PayFlow routing sample (fail = defect)"
            cat <<'FTR'
  <p class="muted">Each demo run overwrites this site. JSON artifacts remain on the workflow run as a fallback.</p>
</body>
</html>
FTR
          } > site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Live report"
            echo
            echo "Open the site (no download): ${{ steps.deployment.outputs.page_url }}"
            echo
            echo "Settings → Pages must use **GitHub Actions** as the source, or this job fails."
          } >> "$GITHUB_STEP_SUMMARY"
