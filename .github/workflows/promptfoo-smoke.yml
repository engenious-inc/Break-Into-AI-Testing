name: Promptfoo smoke

# Tiny one-case Groq check (Module 0 contains). Prefer the fuller classroom demo:
# Actions → "Promptfoo eval & red team" (promptfoo-demo.yml) for ordinary eval +
# inverted red team (+ optional PayFlow).
#
# Needs GROQ_API_KEY under Settings → Secrets and variables → Actions.
# Node 22: promptfoo@latest requires >=22.22.0.
on:
  workflow_dispatch:

concurrency:
  group: promptfoo-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Module 0 contains (1 case)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check GROQ_API_KEY secret
        id: key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GROQ_API_KEY is not set — skipping. Prefer workflow Promptfoo eval & red team for the full demo."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ordinary Promptfoo eval (paced for free tier)
        if: steps.key.outputs.present == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          npx --yes promptfoo@latest eval \
            -c modules/00-promptfoo-basics/03-assertions/contains/promptfooconfig.yaml \
            -j 1 \
            --delay 1000
      - name: Skipped (no secret)
        if: steps.key.outputs.present != 'true'
        run: echo "No-op — secret unset; job stays green for forks / unset orgs."
