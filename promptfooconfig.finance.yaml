description: "Breaking GPT & Claude — workshop eval (FinanceBot, free-tier-safe default: 3 models, curated 8-case subset)"

prompts:
  - file://prompts/financebot.txt

# Workshop config — kept small on purpose so it runs reliably on Groq's free tier
# (~30 req/min). Three representative models: a non-thinking Qwen, a hidden-reasoning GPT-OSS 120B, and a
# visible-CoT GPT-OSS 20B (the verbose one). To widen the matrix, uncomment the
# extra Groq models (or the paid OpenAI/Anthropic providers) below — but watch the
# rate limit, and add `-j 2` if you start hitting throttling.
providers:
  - id: groq:qwen/qwen3.6-27b
    config:
      temperature: 0
      max_tokens: 400
      reasoning_effort: none
      reasoning_format: hidden

  - id: groq:openai/gpt-oss-120b
    config:
      temperature: 0
      max_tokens: 400
      include_reasoning: false

  - id: groq:openai/gpt-oss-20b
    config:
      temperature: 0
      max_tokens: 400

  # Add back for the full lineup (slower on free tier):
  # - id: groq:meta-llama/llama-4-scout-17b-16e-instruct
  # - id: groq:openai/gpt-oss-120b  # now in the default matrix above
  # - id: groq:openai/gpt-oss-safeguard-20b
  # OPTIONAL — cross-vendor comparison (paid keys):
  # - id: openai:gpt-4o-mini
  # - id: anthropic:messages:claude-haiku-4-5

defaultTest:
  options:
    provider: groq:qwen/qwen3.6-27b

# Curated 8-case subset — kept deliberately small so a live demo stays under Groq's free tier.
tests:
  - file://tests/smoke.finance.yaml
