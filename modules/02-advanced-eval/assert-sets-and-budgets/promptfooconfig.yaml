description: "Advanced 2 — assert-set (OR via threshold) + latency/cost budgets across two Groq models"
prompts:
  - "Greet the user in French in one short sentence."
providers:
  # Two Groq models, same synthetic $/token rates — you are not billed; Promptfoo
  # multiplies rates by each model's token counts so the cost column and `type: cost`
  # assert have a number. Compare latency, cost, and answer quality side by side.
  - id: groq:qwen/qwen3.8-27b
    label: qwen-3.8-27b
    config: { temperature: 0, max_tokens: 120, reasoning_effort: none, reasoning_format: hidden, inputCost: 0.0001, outputCost: 0.0002 }
  - id: groq:openai/gpt-oss-120b
    label: gpt-oss-120b
    config: { temperature: 0.5, include_reasoning: false, inputCost: 0.0001, outputCost: 0.0002 }
defaultTest:
  options:
    provider: groq:qwen/qwen3.8-27b
tests:
  - assert:
      - type: icontains
        value: "bonjour"
        weight: 2
        metric: Correctness
      # An assert-set with threshold 0.5 = OR: either sub-assertion can carry the set.
      - type: assert-set
        threshold: 0.5
        metric: Performance
        assert:
          - type: latency
            threshold: 2000   # ms — runs on Groq
          - type: javascript
            value: "output.length <= 200"   # lenient length ceiling — the OR-partner for latency
      # Hard budget: outside the assert-set so a miss fails the test (AND, not OR).
      - type: cost
        threshold: 0.005
        metric: Cost
