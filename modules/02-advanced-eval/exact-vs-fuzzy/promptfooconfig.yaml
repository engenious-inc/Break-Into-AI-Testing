description: "Advanced 3 — exact (equals) vs fuzzy (icontains) matching; embedding similar is opt-in"
prompts:
  - "Translate to French, greeting form: 'How are you?'"
providers:
  - id: groq:qwen/qwen3.8-27b
    config: { temperature: 0.2, max_tokens: 60, reasoning_effort: none, reasoning_format: hidden}
tests:
  - assert:
      - type: icontains
        value: "comment"
        weight: 1
        metric: Accuracy
      # Exact match (equals) is brittle for open-ended generation — any wording/punctuation
      # difference fails (demo: expect FAIL vs "Comment allez-vous ?"):
      - type: equals
        value: "Comment ça va ?"
        weight: 1
        metric: Accuracy
      # Embedding-based fuzzy match (local transformers — same path as answer-relevance;
      # default OpenAI embeddings need OPENAI_API_KEY and were credit-exhausted for this demo):
      - type: similar
        value: "Comment ça va ?"
        threshold: 0.4
        weight: 1
        metric: Accuracy
        provider: transformers:feature-extraction:Xenova/all-MiniLM-L6-v2
