description: "Advanced 3 — exact (equals) vs fuzzy (icontains) matching; embedding similar is opt-in"
prompts:
  - "Translate to French, greeting form: 'How are you?'"
providers:
  - id: groq:qwen/qwen3.6-27b
    config: { temperature: 0.2, max_tokens: 60, reasoning_effort: none, reasoning_format: hidden}
tests:
  - assert:
      - type: icontains
        value: "comment"
        weight: 1
        metric: Accuracy
      # Exact match (equals) is brittle for open-ended generation — any wording/punctuation
      # difference fails; shown commented so the keyless default run stays green:
      # - type: equals
      #   value: "Comment ça va ?"
      #   weight: 1
      #   metric: Accuracy
      # Embedding-based fuzzy match needs OPENAI_API_KEY (Groq has no embeddings) — opt-in:
      # - type: similar
      #   value: "Bonjour, comment ça va ?"
      #   threshold: 0.7
      #   weight: 1
      #   metric: Accuracy
