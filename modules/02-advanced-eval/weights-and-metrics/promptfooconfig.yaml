description: "Advanced 1 — weighted assertions + named metrics + test threshold"
prompts:
  - "Answer enthusiastically in under 50 words: what is {{topic}}?"
providers:
  - id: groq:qwen/qwen3.6-27b
    config: { temperature: 0.7, max_tokens: 120, reasoning_effort: none, reasoning_format: hidden}
defaultTest:
  options:
    provider: groq:qwen/qwen3.6-27b
tests:
  - vars: { topic: "an index fund" }
    threshold: 0.7
    assert:
      - type: llm-rubric
        value: "The response is enthusiastic."
        weight: 2
        metric: Tone
      - type: javascript
        value: "output.split(/\\s+/).length <= 50"
        weight: 1
        metric: Tone
      - type: icontains
        value: "fund"
        weight: 1
        metric: Accuracy
