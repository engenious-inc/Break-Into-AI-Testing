description: "Advanced 6 — temperature sensitivity (0.7 vs 1.0) across two personas"
prompts:
  - file://prompts/empathetic.txt
  - file://prompts/blunt.txt
providers:
  - id: groq:qwen/qwen3.6-27b
    label: qwen-27b@0.7
    config: { temperature: 0.7, max_tokens: 200, reasoning_effort: none, reasoning_format: hidden }
  - id: groq:qwen/qwen3.6-27b
    label: qwen-27b@1.0
    config: { temperature: 1.0, max_tokens: 200, reasoning_effort: none, reasoning_format: hidden }
defaultTest:
  options:
    provider: groq:qwen/qwen3.6-27b
tests:
  - vars: { query: "My payment failed twice and I'm frustrated." }
    assert:
      - type: llm-rubric
        value: "The reply acknowledges the failed payment and offers at least one concrete next step (retry, check card details, or contact support)."
  - vars: { query: "I got scammed." }
    assert:
      - type: not-regex
        value: '(?i)\b(great|awesome|exciting|wonderful|fantastic|yay|thrilling)\b'
      - type: llm-rubric
        value: "The reply treats the scam as a serious problem (does not celebrate or treat it as good news) and offers at least one concrete next step (report, dispute, freeze the account, or contact support)."
