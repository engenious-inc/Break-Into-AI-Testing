# OPTIONAL: Assertions 5/5 — answer-relevance (local embeddings, no paid key)
# answer-relevance scores topical relevance using embeddings. Groq has no embeddings,
# so this lesson uses transformers.js locally for the embedding step.
description: "Assertions 5/5 — OPTIONAL model-graded answer-relevance (local transformers embeddings)"
prompts:
  - "Explain photosynthesis in two sentences."
providers:
  - id: groq:llama-3.3-70b-versatile
    config: { temperature: 0, max_tokens: 400 }
defaultTest:
  options:
    # text grader on Groq; embeddings run locally (no OPENAI/GOOGLE key required).
    provider:
      text: groq:llama-3.3-70b-versatile
      embedding: transformers:feature-extraction:Xenova/all-MiniLM-L6-v2
tests:
  - assert:
      - type: answer-relevance
        # MiniLM cosine scores land lower than OpenAI embeddings; 0.5 still fails off-topic answers.
        threshold: 0.5
