description: "Assertions 4/5 — model-graded llm-rubric"
prompts:
  - "Write a short welcome message for a new user."
providers:
  - id: groq:llama-3.3-70b-versatile
    config: { temperature: 0, max_tokens: 400 }
defaultTest:
  options:
    provider: groq:llama-3.3-70b-versatile
tests:
  - assert:
      - type: llm-rubric
        value: "The response is friendly and welcoming."
      - type: javascript
        value: "output.split(/\\s+/).length <= 50"
