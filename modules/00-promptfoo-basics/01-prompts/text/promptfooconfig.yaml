description: "Prompts 1/4 — inline text prompts (one-liners)"
prompts:
  - "Translate to French: {{text}}"
  - "Summarize in one sentence: {{text}}"
providers:
  - id: groq:qwen/qwen3.8-27b
    name: "Groq Qwen 3.8 27B"
    config: { temperature: 0, max_tokens: 400, reasoning_effort: none, reasoning_format: hidden }
  - id: groq:openai/gpt-oss-120b
    name: "Groq GPT-OSS 120B"
    config: { temperature: 0, max_tokens: 400, include_reasoning: false }
tests:
  - vars: { text: "The market closed higher today on strong tech earnings." }
