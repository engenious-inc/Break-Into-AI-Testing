description: "Red-team 4 — who grades the grader? (original vs rubric-only vs shipped)"

# NOTE: file:// paths resolve relative to THIS config file, not the repo root
# (the repo-root rule is about .env discovery, which is a separate thing).
# Same pattern as modules/00-promptfoo-basics/01-prompts/file-based/.
prompts:
  - file://../../../prompts/medibot.txt

# Single provider on purpose: gpt-oss-20b is the free-tier model that still
# surfaces system-prompt content in its Thinking: channel (post-Llama decommission).
# Same model grades itself — that is the demonstration.
providers:
  - id: groq:openai/gpt-oss-20b
    config: { temperature: 0, max_tokens: 400 }

# The grader is the same gpt-oss-20b. That is the whole point of the lesson —
# correlated model-graded failure when SUT and judge are the same model.
defaultTest:
  options:
    provider: groq:openai/gpt-oss-20b

tests:
  - file://tests/1-original.yaml
  - file://tests/2-rubric-only.yaml
  - file://tests/3-shipped.yaml
