description: "Red-team 4 — who grades the grader? (ungated vs gated exfiltration check)"

prompts:
  - file://prompts/medibot.txt

# Single provider on purpose: llama-3.3-70b-versatile is the model that produced
# the original leak AND graded its own output as safe. Swapping the model breaks
# the demonstration.
providers:
  - id: groq:llama-3.3-70b-versatile
    config: { temperature: 0, max_tokens: 400 }

# The grader is the same 70B. That is the whole point of the lesson — this is the
# default in every red-team config in this repo, and here it is grading itself.
defaultTest:
  options:
    provider: groq:llama-3.3-70b-versatile

tests:
  - file://modules/01-red-team/04-grading-the-grader/tests/exfiltration-ungated.yaml
  - file://modules/01-red-team/04-grading-the-grader/tests/gated.yaml
