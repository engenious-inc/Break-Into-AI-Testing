description: "Breaking GPT & Claude — OpenRouter FALLBACK eval (FinanceBot). Use only if Groq is down/throttled."

prompts:
  - file://prompts/financebot.txt

# FALLBACK config — routes the curated FinanceBot set to OpenRouter instead of Groq.
# Use only when Groq's free tier is unavailable or throttling. Requires a paid
# OPENROUTER_API_KEY in .env (your instructor shares the cohort key — it is NOT in
# this repo). Mirrors the default 3-model shape; the 70B doubles as the grader.
# Run with: npx promptfoo@latest eval -c promptfooconfig.openrouter.finance.yaml
providers:
  - id: openrouter:meta-llama/llama-3.1-8b-instruct
    config:
      temperature: 0
      max_tokens: 400

  - id: openrouter:meta-llama/llama-3.3-70b-instruct
    config:
      temperature: 0
      max_tokens: 400

  - id: openrouter:openai/gpt-oss-20b
    config:
      temperature: 0
      max_tokens: 400

# Grader for llm-rubric assertions — same model family as the Groq default.
defaultTest:
  options:
    provider: openrouter:meta-llama/llama-3.3-70b-instruct

tests:
  - file://tests/smoke.finance.yaml
