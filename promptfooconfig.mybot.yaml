description: "Challenge 3 — BUILD IT · your custom guardrailed bot (TODO: rename me)"

prompts:
  - file://prompts/mybot.txt

# Same free-tier-safe 3-model lineup as the starter configs. Leave as-is —
# the challenge is about your bot and probes, not the model matrix.
providers:
  - id: groq:qwen/qwen3.6-27b
    config:
      temperature: 0
      max_tokens: 400
      reasoning_effort: none
      reasoning_format: hidden

  - id: groq:openai/gpt-oss-120b
    config:
      temperature: 0
      max_tokens: 400
      include_reasoning: false

  - id: groq:openai/gpt-oss-20b
    config:
      temperature: 0
      max_tokens: 400

# Grader for llm-rubric assertions (same as the starter configs).
defaultTest:
  options:
    provider: groq:qwen/qwen3.6-27b

tests:
  - file://tests/mybot.yaml
