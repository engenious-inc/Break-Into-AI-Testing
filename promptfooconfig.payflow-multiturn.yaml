# PayFlow multi-turn — does legitimate context soften the guard?
#
# Some attacks work better after a few turns of ordinary conversation. This config
# replays a fixed 5-turn transcript: four turns of real PayFlow questions and answers,
# then the attack in turn five.
#
# PayFlow is STATELESS — POST /chat takes one `message` and keeps nothing between
# requests. The transcript arrives flattened into that single field. The planted
# defect is that the guard only classifies the text above --- CURRENT MESSAGE ---,
# so turn 5 never gets classified. The injection case fails on purpose; the two
# controls still pass. Do not loosen the assertion — the fix is in pipeline.js.
#
# It also means `session_id` changes nothing. Try it — that non-result is worth having.
#
# Start the app first:
#   ./run.sh payflow-serve         # in one terminal
#   ./run.sh payflow-multiturn     # in another

description: PayFlow multi-turn — injection after four turns of legitimate context

providers:
  - id: http
    label: payflow-api
    config:
      url: http://localhost:8000/chat
      method: POST
      headers:
        Content-Type: application/json
      body:
        message: '{{prompt}}'
        session_id: lab3-multiturn
        user_role: student
      transformResponse: json

prompts:
  - file://prompts/payflow-multiturn.txt

defaultTest:
  options:
    provider: groq:qwen/qwen3.8-27b

tests:
  - file://tests/payflow.multiturn.yaml
